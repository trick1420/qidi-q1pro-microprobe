#Mates3
[include timelapse.cfg]
[include Adaptive_Mesh.cfg]
[include gcode_macro.cfg]
#[inculde gcode_macro.cfg]

[mcu]
serial: /dev/ttyS2
restart_method: command

[mcu U_1]
serial: /dev/ttyS0
restart_method: command

[respond]
default_type: echo
#   将 "M118 "和 "RESPOND "输出的默认前缀设置为以下之一：
#      echo: "echo: " (这是默认的)
#      command: "// "
#      error: "!!"
#default_prefix: echo:
#   直接设置默认的前缀。如果定义，这个值将覆盖 "default_type"。

[save_variables] 
filename =/home/mks/klipper_config/saved_variables.cfg


[temperature_sensor hot] 
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin:U_1:PA1
min_temp:0
max_temp:100

[duplicate_pin_override]
pins:
     gpio21

[temperature_sensor 2040]
#sensor_mcu: MKS_THR
sensor_type: temperature_mcu
min_temp: 0
max_temp: 150 



[bed_screws]
#[screws_tilt_adjust]
screw1:40,40
screw1_name: Front left
screw2: 210,40
screw2_name: Front right
screw3: 210,210
screw3_name: Last right
screw4: 40,210
screw3_name: Last left
#screw_thread: CW-M4


[force_move]
enable_force_move : False


[hall_filament_width_sensor]
adc1: gpio27
adc2: gpio28
#   Analog input pins connected to the sensor. These parameters must
#   be provided.
cal_dia1: 1.50
cal_dia2: 2.0
#   The calibration values (in mm) for the sensors. The default is
#   1.50 for cal_dia1 and 2.00 for cal_dia2.
raw_dia1: 14397
raw_dia2: 15058

#   传感器的原始校准值. The default is 9500
#   for raw_dia1 and 10500 for raw_dia2.
default_nominal_filament_diameter: 1.75
#   The nominal filament diameter. This parameter must be provided.
max_difference: 0
#   Maximum allowed filament diameter difference in millimeters (mm).
#   If difference between nominal filament diameter and sensor output
#   is more than +- max_difference, extrusion multiplier is set back
#   to %100. The default is 0.200.
measurement_delay: 50
#   传感器到熔化室/热端的距离毫米(mm)。传感器和热端之间的灯丝将被视为default_nomal_filament_diameter。宿主
#   模块工作与FIFO逻辑。它保留每个传感器的值和
#  在数组中定位并将它们弹出到正确的位置。这参数。
enable: false
#   Sensor enabled or disabled after power on. The default is to
#   disable.
measurement_interval: 10
#   The approximate distance (in mm) between sensor readings. The
#   default is 10mm.
logging: False
#   Out diameter to terminal and klipper.log can be turn on|of by
#   command.
min_diameter: 0.3
#   Minimal diameter for trigger virtual filament_switch_sensor.
use_current_dia_while_delay: False
#   Use the current diameter instead of the nominal diameter while
#   the measurement delay has not run through.
pause_on_runout:True
runout_gcode:
            pause
            RESET_FILAMENT_WIDTH_SENSOR
            query_filament_width
#insert_gcode:
event_delay: 3.0
pause_delay: 0.5
#   See the "filament_switch_sensor" section for a description of the
#   above parameters.

        

[extruder]
step_pin:gpio5
dir_pin:gpio4
enable_pin:!gpio10
rotation_distance: 53.5  #22.6789511	#Bondtech 5mm Drive Gears
gear_ratio: 9.5:1				
microsteps: 16
full_steps_per_rotation: 200	#200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
min_temp: 0
max_temp: 360
min_extrude_temp: 175
smooth_time: 0.000001
heater_pin:gpio24
sensor_type:MAX6675
#   One of "MAX6675", "MAX31855", "MAX31856", or "MAX31865".
#   One of "MAX6675", "MAX31855", "MAX31856", or "MAX31865".
sensor_pin:gpio17
#   The chip select line for the sensor chip. This parameter must be
#   provided.
spi_speed: 100000
#   The SPI speed (in hz) to use when communicating with the chip.
#   The default is 4000000.
#spi_bus:spi1
spi_software_sclk_pin:gpio18
spi_software_mosi_pin:gpio19
spi_software_miso_pin:gpio16
#   See the "common SPI settings" section for a description of the
#   above parameters.
#tc_type: K
#tc_use_50Hz_filter: False
#c_averaging_count: 1
#   The above parameters control the sensor parameters of MAX31856
#   chips. The defaults for each parameter are next to the parameter
#   name in the above list.
max_power: 1

control : pid  
#pid_Kp=33.555
#pid_Ki=4.76
#pid_Kd=59.141

pid_Kp=14.734
pid_Ki=6.549 
pid_Kd=8.288

pressure_advance: 0.032
pressure_advance_smooth_time: 0.03
max_extrude_cross_section:500
instantaneous_corner_velocity: 10.000
max_extrude_only_distance: 1000.0
max_extrude_only_velocity:5000
max_extrude_only_accel:2000
step_pulse_duration:0.000002


[tmc2209 extruder]
uart_pin:gpio6
interpolate: True
run_current: 0.714
#hold_current: 0.2
#sense_resistor: 0.110
stealthchop_threshold: 0


[adxl345]
cs_pin:gpio13
spi_software_sclk_pin:gpio14
spi_software_mosi_pin:gpio15
spi_software_miso_pin:gpio12
axes_map: -x, z, -y


[printer]
kinematics:corexy
max_velocity: 600
max_accel: 20000
max_accel_to_decel: 10000
max_z_velocity: 30
max_z_accel: 500
square_corner_velocity: 8




[stepper_x]
step_pin:U_1:PB4
dir_pin:!U_1:PB3
enable_pin:!U_1:PB5
microsteps:16
rotation_distance: 39.96
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:tmc2240_stepper_x:virtual_endstop
position_min: -2.5  
position_endstop: -2.5
position_max:245
homing_speed:40
homing_retract_dist:0
homing_positive_dir:False
step_pulse_duration:0.0000001

[stepper_y]
step_pin:U_1:PC14
dir_pin:!U_1:PC13
enable_pin:!U_1:PC15
microsteps: 16
rotation_distance: 39.96
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
endstop_pin:tmc2240_stepper_y:virtual_endstop
position_min: -2.5  
position_endstop: -2.5
position_max: 258
homing_speed:40
homing_retract_dist:0
homing_positive_dir:False
step_pulse_duration:0.0000001



[stepper_z]
step_pin:U_1:PC10
dir_pin:U_1:PA15
enable_pin:!U_1:PC11
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
endstop_pin:!gpio21#!PC3 #for Z-max; endstop have'!' is NO
position_endstop:0
position_max:245
position_min: -6
homing_speed: 8
second_homing_speed: 8
homing_retract_dist: 8.0
homing_positive_dir:false
step_pulse_duration:0.0000001

[stepper_z1]
step_pin:U_1:PB1
dir_pin:U_1:PB6
enable_pin:!U_1:PB0
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
step_pulse_duration:0.0000001

[z_tilt]
z_positions:
    -59,125
    307.5,125

points:
    5,125
    220,125

speed: 150
horizontal_move_z: 10
retries: 2
retry_tolerance: 0.05

[tmc2240 stepper_y]
cs_pin:U_1:PB9
spi_software_sclk_pin:U_1:PA5
spi_software_mosi_pin:U_1:PA7
spi_software_miso_pin:U_1:PA6
spi_speed:200000
run_current: 1.07
#hold_current: 0.5
interpolate:true
stealthchop_threshold:150
diag0_pin:!U_1:PC0
driver_SGT:1

[tmc2240 stepper_x]
cs_pin:U_1:PD2
spi_software_sclk_pin:U_1:PA5
spi_software_mosi_pin:U_1:PA7
spi_software_miso_pin:U_1:PA6
spi_speed:200000
run_current: 1.07
#hold_current: 0.5
interpolate:true
stealthchop_threshold:150
diag0_pin:!U_1:PB8
driver_SGT:1


[tmc2209 stepper_z]
uart_pin:U_1: PC5
run_current: 0.57
#hold_current: 0.17
interpolate: True
stealthchop_threshold: 9999999999

[tmc2209 stepper_z1]
uart_pin:U_1: PB7
run_current: 0.57
#hold_current: 0.17
interpolate: True
stealthchop_threshold: 99999999


##热床热腔==================================================================================================================

[heater_bed]
heater_pin: U_1:PB10
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin:U_1: PA0
max_power: 1.0
control = pid
pid_Kp=63.418 
pid_Ki=1.342 
pid_Kd=749.125
min_temp: -20
max_temp: 125



[verify_heater extruder]
max_error: 120
check_gain_time:20
hysteresis: 5
heating_gain: 1

[verify_heater heater_bed]
max_error: 120
check_gain_time:60
hysteresis: 3
heating_gain: 1


##一些引脚定义======================================

##主板上大涡轮风扇
[output_pin fan2]
pin: U_1:PA8
pwm: True
cycle_time: 0.00100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0



##喷头喉管风扇 50度自启动
#[heater_fan my_nozzle_fan1]
#pin:PC9
#max_power:1
#shutdown_speed:1
#cycle_time:0.05
#kick_start_time:0.05
#off_below:0
#heater:extruder
#heater_temp:50.0

##活性炭吹风扇
[output_pin fan3]
pin:U_1:PC9
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0
scale: 255
shutdown_value: 0.0


## FAN0  喉管风扇
[heater_fan hotend_fan]
pin:gpio25
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
off_below: 0

[heater_fan board_fan]
pin:U_1:PC4
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
off_below: 0


## FAN1  吹模型风扇
[output_pin fan0]
pin:gpio2
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0
scale: 255
shutdown_value: 0.0

##LED 灯
[output_pin caselight]
##  Chamber Lighting - In 5V-RGB Position
pin: U_1:PC7
pwm: false
shutdown_value:1
value:1
#cycle_time:0.01

[output_pin beeper]
##  Chamber Lighting - In 5V-RGB Position
pin:U_1: PA2
pwm: false
shutdown_value:0
value:0


[probe]
pin:^!gpio21
x_offset: 17.6
y_offset: 4.4
#z_offset: 0.0
speed:7
lift_speed:7
samples: 2
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.08
samples_tolerance_retries:3

[bed_mesh]
speed:150                #调平速度
horizontal_move_z:10   #调平中Z抬高高度
mesh_min:30,10      #探测点最小位置
mesh_max:230,230     #探测点最大位置
probe_count:6,6     #调平点数
algorithm:bicubic
bicubic_tension:0.2
#move_check_distance:10
#relative_reference_index:0
mesh_pps: 4, 4


#[gcode_macro G30]
#    G28
#    G1 X100 Y130 Z10
#    PROBE_CALIBRATE


[resonance_tester]
accel_chip:adxl345
probe_points:
   120, 120, 10  # an example




[idle_timeout]
timeout: 5400

[pause_resume]


[display_status]


#[mcu rpi]
#serial: /tmp/klipper_host_mcu

[virtual_sdcard]
#path:/home/mks/uploads
path: ~/gcode_files

