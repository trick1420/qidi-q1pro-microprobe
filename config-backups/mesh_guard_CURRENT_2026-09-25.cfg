#####################################################################
#  MESH GUARD  -  abort the print if the bed mesh looks implausible
#####################################################################
#
#  WHY THIS EXISTS
#  ---------------
#  On 2026-09-19 at 14:48 the non-contact probe (QIDI_PROBE_PIN_2)
#  misfired during G29. The zero-reference probe returned 2.201
#  instead of its normal ~3.38, and the resulting mesh told the
#  printer to lift the nozzle by up to +0.954 mm across the part.
#  It then extruded 6983 mm of PETG into open air for 66 minutes.
#
#  A broken mesh is trivially distinguishable from a good one:
#
#     time    range   peak    max step    result
#     00:21   0.030   0.023     ~0.02     good
#     00:51   0.157   0.138     ~0.05     good
#     09:44   0.168   0.133     ~0.05     good
#     10:23   0.098   0.089     ~0.04     good
#     17:18   0.135   0.145     ~0.05     good
#     14:48   1.175   0.954      0.62     BROKEN
#
#  The factory full-bed [bed_mesh default] profile reaches
#  range 0.533 / peak 0.449 / step 0.155, so the limits below are
#  set above that to avoid false aborts on whole-plate prints,
#  while still leaving better than 2x margin under the broken run.
#
#  Tighten them once you have a baseline - every run prints its
#  numbers to the console, so after a week you will know your real
#  spread. Adjust live without restarting:
#
#     SET_GCODE_VARIABLE MACRO=VALIDATE_MESH VARIABLE=max_range VALUE=0.5
#
#
#  INSTALL
#  -------
#  1. Back up printer.cfg first:
#       cp ~/klipper_config/printer.cfg ~/klipper_config/printer.cfg.bak
#
#  2. Keep this as its own file and pull it in from printer.cfg:
#       [include mesh_guard.cfg]
#     Better than pasting the macros inline, because this machine runs
#     SAVE_CONFIG on every print and anything living below the
#       #*# <---------------------- SAVE_CONFIG ---------------------->
#     marker gets rewritten. Note the INCLUDE LINE ITSELF still has to
#     sit above that marker or it will be wiped on the next save.
#
#  3. In [gcode_macro PRINT_START], add VALIDATE_MESH directly after
#     G29 so it runs before the hotend comes up to print temperature:
#
#         G28
#         CLEAR_NOZZLE HOTEND={hotendtemp}
#         M190 S{bedtemp}
#         G29
#         VALIDATE_MESH          <-- add this line
#         G0 Z50 F600
#         ...
#
#  4. RESTART, then run a print and confirm you see the
#     "MESH CHECK" line in the console.
#
#  TEST IT before trusting it - drop max_range to something
#  deliberately tiny (SET_GCODE_VARIABLE ... VALUE=0.01), start a
#  print, and confirm it aborts cleanly at the right moment. Then
#  put the limit back.
#
#####################################################################


[gcode_macro VALIDATE_MESH]
description: Sanity-check the active bed mesh; abort the print if the probe misfired
variable_max_range: 0.80    # max allowed (highest - lowest) across the mesh, mm
variable_max_abs:   0.60    # max allowed magnitude of any single point, mm
variable_max_step:  0.25    # max allowed jump between neighbouring points, mm
gcode:
    {% set bm = printer.bed_mesh %}
    {% set pm = bm.probed_matrix %}
    {% set m  = pm if (pm|length > 0 and pm[0]|length > 0) else bm.mesh_matrix %}

    {% if bm.profile_name == "" or m|length == 0 or m[0]|length == 0 %}
        { action_respond_info("MESH CHECK: no active mesh after G29") }
        _MESH_GUARD_ABORT
        _MESH_GUARD_HALT
    {% else %}
        {% set zs = [] %}
        {% for row in m %}{% for z in row %}{% set _ = zs.append(z) %}{% endfor %}{% endfor %}
        {% set lo   = zs|min %}
        {% set hi   = zs|max %}
        {% set span = hi - lo %}
        {% set peak = [hi|abs, lo|abs]|max %}

        # largest jump between adjacent points, along rows then columns.
        # A real bed is smooth; a misfiring probe is not.
        {% set steps = [] %}
        {% for row in m %}
            {% for i in range(row|length - 1) %}
                {% set _ = steps.append((row[i+1] - row[i])|abs) %}
            {% endfor %}
        {% endfor %}
        {% for r in range(m|length - 1) %}
            {% for c in range(m[r]|length) %}
                {% set _ = steps.append((m[r+1][c] - m[r][c])|abs) %}
            {% endfor %}
        {% endfor %}
        {% set step = steps|max if steps|length > 0 else 0.0 %}

        { action_respond_info(
            "MESH CHECK  %dx%d pts  min=%.3f max=%.3f | range=%.3f/%.2f  peak=%.3f/%.2f  step=%.3f/%.2f"
            % (m|length, m[0]|length, lo, hi,
               span, max_range, peak, max_abs, step, max_step)) }

        {% if span > max_range or peak > max_abs or step > max_step %}
            { action_respond_info("MESH CHECK FAILED - see limits above") }
            _MESH_GUARD_ABORT
            _MESH_GUARD_HALT
        {% endif %}
    {% endif %}


# Runs first: makes the machine safe.
#
# NOTE: do NOT call CANCEL_PRINT from here. CANCEL_PRINT ends with
# SDCARD_RESET_FILE, and Klipper refuses that command while the gcode
# calling it is itself being fed from the SD file - which is exactly
# where we are, since VALIDATE_MESH runs inside PRINT_START. You get
# "!! SDCARD_RESET_FILE cannot be run from the sdcard" instead.
#
# So we do the cleanup by hand and let _MESH_GUARD_HALT stop the file.
# The job is left halted rather than cancelled; press Cancel in
# Fluidd/Mainsail to clear it. That is deliberate - it makes you
# acknowledge the abort instead of it disappearing quietly.
[gcode_macro _MESH_GUARD_ABORT]
description: Safe shutdown after a failed mesh check
gcode:
    M117 MESH CHECK FAILED
    { action_respond_info(
        "MESH GUARD: bed mesh failed validation - the probe almost certainly "
        "misfired. Aborting now instead of printing into thin air.\n"
        "Re-run G28 then G29 and check the MESH CHECK numbers. If it repeats, "
        "inspect the probe connector at the toolhead, the cable through the "
        "drag chain, and the sensor face for debris.") }
    TURN_OFF_HEATERS
    M104 S0
    M140 S0
    M141 S0
    M106 P0 S0
    M106 P2 S0
    M106 P3 S0
    G90
    {% if printer.gcode_move.position.z < 150 %}
        G1 Z150 F480
    {% endif %}
    G1 X0 Y0 F7800
    M400
    BEEP I=4 DUR=300


# Runs second: raises a hard error so the REST of PRINT_START
# (M109, fans, etc.) never executes. This has to be a separate macro
# because action_raise_error fires at template-render time - if it
# were in VALIDATE_MESH, none of the cleanup above would ever run.
[gcode_macro _MESH_GUARD_HALT]
description: Hard-stop the remainder of PRINT_START after a failed mesh check
gcode:
    # Keep this SHORT. It surfaces once per level of the macro call
    # stack as the error unwinds (HALT -> VALIDATE_MESH -> PRINT_START),
    # so you see it about three times. The detail is printed once by
    # _MESH_GUARD_ABORT just above.
    { action_raise_error("MESH GUARD: mesh failed validation - print halted.") }
